<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151e"/>
      <stop offset="50%" stop-color="#0b1e2c"/>
      <stop offset="100%" stop-color="#040c12"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="bmGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(6,182,212,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#bmBg)"/>
  <rect width="800" height="480" fill="url(#bmGrid)"/>

  <!-- Top Window Header Bar -->
  <rect x="25" y="18" width="750" height="42" rx="8" fill="#08202d" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <circle cx="50" cy="39" r="5" fill="#ef4444"/>
  <circle cx="68" cy="39" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="39" r="5" fill="#10b981"/>
  <text x="110" y="44" font-family="'Space Grotesk', monospace" font-size="12" fill="#7dd3fc" font-weight="600">BANK MANAGEMENT SYSTEM // JAVA SE &amp; JDBC TRANSACTION ENGINE</text>
  <rect x="635" y="27" width="125" height="24" rx="4" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
  <text x="697" y="43" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#a5f3fc" text-anchor="middle">ACID INNODB</text>

  <!-- Left Main Panel: Transaction Ledger & Customer Account CRUD -->
  <g transform="translate(25, 72)">
    <rect width="465" height="388" rx="10" fill="#061824" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

    <text x="22" y="30" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">CUSTOMER &amp; ACCOUNT TRANSACTION MANAGER</text>
    <text x="22" y="48" font-family="'Space Grotesk', monospace" font-size="10" fill="#64748b">ACID Compliant Database Transactions // JDBC Connection Pool</text>

    <!-- CRUD Operation Record Cards -->
    <g transform="translate(20, 65)">
      <!-- Record 1 -->
      <rect width="425" height="52" rx="6" fill="#031017" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
      <circle cx="26" cy="26" r="11" fill="rgba(6,182,212,0.2)"/>
      <text x="26" y="30" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle">&#10003;</text>
      <text x="48" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ACC #88219412 &#8226; Rajesh Kumar</text>
      <text x="48" y="40" font-family="'Space Grotesk', monospace" font-size="9.5" fill="#94a3b8">Savings Account | Balance: INR 1,42,850.00 | Status: ACTIVE</text>
      <text x="408" y="31" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#10b981" text-anchor="end">+25,000 CR</text>

      <!-- Record 2 -->
      <g transform="translate(0, 62)">
        <rect width="425" height="52" rx="6" fill="#031017" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="26" cy="26" r="11" fill="rgba(16,185,129,0.2)"/>
        <text x="26" y="30" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">&#10003;</text>
        <text x="48" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ACC #88219413 &#8226; Priya S.</text>
        <text x="48" y="40" font-family="'Space Grotesk', monospace" font-size="9.5" fill="#94a3b8">Current Account | Balance: INR 5,80,200.00 | Status: ACTIVE</text>
        <text x="408" y="31" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="end">-12,400 DR</text>
      </g>

      <!-- Record 3 -->
      <g transform="translate(0, 124)">
        <rect width="425" height="52" rx="6" fill="#031017" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="26" cy="26" r="11" fill="rgba(6,182,212,0.2)"/>
        <text x="26" y="30" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle">&#10003;</text>
        <text x="48" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">ACC #88219414 &#8226; Anand Mohan</text>
        <text x="48" y="40" font-family="'Space Grotesk', monospace" font-size="9.5" fill="#94a3b8">Fixed Deposit | Balance: INR 10,00,000.00 | Term: 24 Months</text>
        <text x="408" y="31" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="end">7.2% INT</text>
      </g>

      <!-- SQL Console Execution Box -->
      <g transform="translate(0, 186)">
        <rect width="425" height="110" rx="6" fill="#02080d" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
        <text x="14" y="22" font-family="'Space Grotesk', monospace" font-size="11" fill="#38bdf8" font-weight="600">&gt; JDBC PreparedStatement SQL Execution:</text>
        <text x="14" y="42" font-family="'Space Grotesk', monospace" font-size="10" fill="#e2e8f0">UPDATE accounts SET balance = balance + ? WHERE acc_no = ?;</text>
        <text x="14" y="62" font-family="'Space Grotesk', monospace" font-size="10" fill="#94a3b8">INSERT INTO transactions (acc_no, type, amount, date) VALUES (?, ?, ?, NOW());</text>
        <text x="14" y="84" font-family="'Space Grotesk', monospace" font-size="10" fill="#10b981" font-weight="600">&#10003; Transaction Committed // Connection Released (0.42ms)</text>
        <circle cx="395" cy="98" r="4" fill="#10b981"/>
        <text x="405" y="102" font-family="'Space Grotesk', monospace" font-size="9" fill="#10b981">LIVE</text>
      </g>
    </g>
  </g>

  <!-- Right Panel: Database & Architecture Telemetry -->
  <g transform="translate(505, 72)">
    <rect width="270" height="388" rx="10" fill="#061824" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

    <text x="20" y="30" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">TRANSACTION ARCHITECTURE</text>

    <g transform="translate(18, 50)">
      <rect width="234" height="66" rx="6" fill="#031017" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">TRANSACTION INTEGRITY</text>
      <text x="14" y="50" font-family="'Space Grotesk', monospace" font-size="20" font-weight="800" fill="#10b981">100% ACID <tspan font-size="11" fill="#64748b">SAFE</tspan></text>
    </g>

    <g transform="translate(18, 128)">
      <rect width="234" height="66" rx="6" fill="#031017" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">DATABASE ENGINE</text>
      <text x="14" y="50" font-family="'Space Grotesk', monospace" font-size="18" font-weight="800" fill="#ffffff">MySQL <tspan font-size="12" fill="#38bdf8">InnoDB</tspan></text>
    </g>

    <g transform="translate(18, 206)">
      <rect width="234" height="158" rx="6" fill="#09202f" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">CORE OPERATIONS</text>
      <text x="14" y="48" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Account Creation &amp; KYC</text>
      <text x="14" y="70" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Deposit / Withdraw CRUD</text>
      <text x="14" y="92" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Transaction Statement Log</text>
      <text x="14" y="114" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Connection Pool Recycling</text>
      <rect x="14" y="124" width="206" height="24" rx="4" fill="#0284c7"/>
      <text x="117" y="140" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">TRANSACTION COMMITTED</text>
    </g>
  </g>
</svg>