<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="kgViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="barSkill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#kgBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="52" rx="16" fill="#0f172a"/>
  <circle cx="28" cy="26" r="5" fill="#ef4444"/>
  <circle cx="44" cy="26" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="26" r="5" fill="#10b981"/>
  <text x="85" y="31" font-family="'Space Grotesk', monospace" font-size="12" fill="#a5b4fc" letter-spacing="1">KNOWLEDGE GAP INTELLIGENCE // TALENT ASSESSMENT ENGINE</text>
  <rect x="660" y="14" width="115" height="24" rx="12" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1"/>
  <text x="717" y="30" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#c7d2fe" text-anchor="middle">SPRING + REACT</text>

  <!-- Left Main Panel: Competency Gap Radar & Employee Metrics -->
  <g transform="translate(30, 75)">
    <rect width="470" height="395" rx="12" fill="#0d1428" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

    <text x="24" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">EMPLOYEE SKILL MATRIX &amp; GAP ANALYSIS</text>
    <text x="24" y="50" font-family="'Space Grotesk', monospace" font-size="11" fill="#64748b">Role: Backend Engineering Track // 142 Team Members Evaluated</text>

    <!-- Skill Gap Progress Bars -->
    <g transform="translate(24, 75)">
      <!-- Item 1: Java & Spring Boot -->
      <text x="0" y="15" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#cbd5e1">Java &amp; Spring Boot Microservices</text>
      <text x="420" y="15" font-family="'Space Grotesk', monospace" font-size="11" fill="#10b981" text-anchor="end">88% (Proficient)</text>
      <rect x="0" y="24" width="422" height="10" rx="5" fill="#080c18"/>
      <rect x="0" y="24" width="371" height="10" rx="5" fill="url(#barSkill)"/>

      <!-- Item 2: SQL & Database Optimization -->
      <text x="0" y="60" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#cbd5e1">MySQL Query Optimization &amp; Indexing</text>
      <text x="420" y="60" font-family="'Space Grotesk', monospace" font-size="11" fill="#06b6d4" text-anchor="end">78% (Target 85%)</text>
      <rect x="0" y="69" width="422" height="10" rx="5" fill="#080c18"/>
      <rect x="0" y="69" width="329" height="10" rx="5" fill="url(#barSkill)"/>

      <!-- Item 3: Distributed Systems -->
      <text x="0" y="105" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#cbd5e1">Distributed Caching &amp; REST Architecture</text>
      <text x="420" y="105" font-family="'Space Grotesk', monospace" font-size="11" fill="#f59e0b" text-anchor="end">64% (Gap: -21%)</text>
      <rect x="0" y="114" width="422" height="10" rx="5" fill="#080c18"/>
      <rect x="0" y="114" width="270" height="10" rx="5" fill="url(#kgViolet)"/>

      <!-- Item 4: Cloud & Docker Deployment -->
      <text x="0" y="150" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#cbd5e1">Docker Containerization &amp; CI/CD</text>
      <text x="420" y="150" font-family="'Space Grotesk', monospace" font-size="11" fill="#ef4444" text-anchor="end">52% (Gap: -33%)</text>
      <rect x="0" y="159" width="422" height="10" rx="5" fill="#080c18"/>
      <rect x="0" y="159" width="219" height="10" rx="5" fill="#ef4444"/>
    </g>

    <!-- Recommended Learning Path Recommendation Card -->
    <g transform="translate(24, 280)">
      <rect width="422" height="85" rx="8" fill="#111a33" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
      <circle cx="28" cy="28" r="12" fill="rgba(99,102,241,0.2)"/>
      <text x="28" y="32" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">&#8594;</text>
      <text x="50" y="24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#e0e7ff">AI Learning Path Generator</text>
      <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Curated 4-week module recommended: "Docker Networking &amp; Container Isolation"</text>
      <text x="50" y="60" font-family="'Space Grotesk', monospace" font-size="10" fill="#38bdf8">Expected Skill Uplift: +28% // Post-assessment scheduled</text>
    </g>
  </g>

  <!-- Right Panel: Role-Based Dashboard Telemetry -->
  <g transform="translate(525, 75)">
    <rect width="245" height="395" rx="12" fill="#0d1428" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">SYSTEM METRICS</text>

    <!-- Metric 1: Roles Evaluated -->
    <g transform="translate(18, 55)">
      <rect width="209" height="70" rx="8" fill="#080c18" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">ORGANISATIONAL ROLES</text>
      <text x="14" y="52" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800" fill="#ffffff">18 <tspan font-size="12" fill="#818cf8">Active</tspan></text>
    </g>

    <!-- Metric 2: Skill Gaps Closed -->
    <g transform="translate(18, 140)">
      <rect width="209" height="70" rx="8" fill="#080c18" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#64748b">SKILL DEFICITS SOLVED</text>
      <text x="14" y="52" font-family="'Space Grotesk', monospace" font-size="22" font-weight="800" fill="#10b981">84.6<tspan font-size="12" fill="#64748b">%</tspan></text>
    </g>

    <!-- Role Based Dashboard Pill -->
    <g transform="translate(18, 225)">
      <rect width="209" height="135" rx="8" fill="#131b35" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">ROLE DASHBOARD</text>
      <text x="14" y="46" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Admin / Lead Access</text>
      <text x="14" y="66" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Employee Self-Assessment</text>
      <text x="14" y="86" font-family="'Space Grotesk', monospace" font-size="10" fill="#cbd5e1">&#10003; Automated Training Feeds</text>
      <rect x="14" y="98" width="181" height="24" rx="4" fill="#6366f1"/>
      <text x="104" y="114" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">LAUNCH DASHBOARD</text>
    </g>
  </g>
</svg>
