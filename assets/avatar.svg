<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#avatarGlow)" />

  <!-- Outer Orbit Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 8" />
  
  <!-- Rotating Tech Ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="120 40 80 50" filter="url(#neonBlur)" opacity="0.85" />
  <circle cx="200" cy="200" r="125" fill="none" stroke="rgba(6,182,212,0.4)" stroke-width="1" stroke-dasharray="2 6" />

  <!-- Core Base -->
  <circle cx="200" cy="200" r="110" fill="url(#coreGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Futuristic Tech Elements -->
  <!-- Target Reticles -->
  <path d="M 200 40 L 200 65 M 200 335 L 200 360 M 40 200 L 65 200 M 335 200 L 360 200" stroke="#06b6d4" stroke-width="2" opacity="0.7" />
  <circle cx="200" cy="52" r="4" fill="#06b6d4" />
  <circle cx="348" cy="200" r="4" fill="#ec4899" />
  <circle cx="200" cy="348" r="4" fill="#8b5cf6" />
  <circle cx="52" cy="200" r="4" fill="#10b981" />

  <!-- Neural Nodes -->
  <g opacity="0.6">
    <line x1="140" y1="160" x2="200" y2="130" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="200" y1="130" x2="260" y2="160" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="260" y1="160" x2="240" y2="240" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="240" y1="240" x2="160" y2="240" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="160" y1="240" x2="140" y2="160" stroke="#8b5cf6" stroke-width="1.5" />
    <line x1="140" y1="160" x2="240" y2="240" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="260" y1="160" x2="160" y2="240" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 3" />
    
    <circle cx="140" cy="160" r="4" fill="#06b6d4" />
    <circle cx="200" cy="130" r="5" fill="#a855f7" />
    <circle cx="260" cy="160" r="4" fill="#ec4899" />
    <circle cx="240" cy="240" r="4" fill="#06b6d4" />
    <circle cx="160" cy="240" r="4" fill="#8b5cf6" />
  </g>

  <!-- Monogram Centerpiece: SS -->
  <g id="monogram" filter="url(#neonBlur)">
    <!-- Elegant stylized 'S' -->
    <text x="200" y="218" font-family="'Space Grotesk', 'Syne', sans-serif" font-size="56" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-2">
      S<tspan fill="url(#ringGrad)">TS</tspan>
    </text>
  </g>

  <!-- Status indicator -->
  <rect x="135" y="278" width="130" height="26" rx="13" fill="#030712" stroke="rgba(16,185,129,0.5)" stroke-width="1" />
  <circle cx="152" cy="291" r="4.5" fill="#10b981" />
  <text x="165" y="295" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#10b981" letter-spacing="1">ONLINE // DEV</text>
</svg>
